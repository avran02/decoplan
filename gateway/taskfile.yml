version: "3"

tasks:
  generate-auth:
    aliases:
      - gen-auth
    cmds:
      - mkdir -p pb
      - protoc -I proto proto/auth.proto --go_out=./pb --go_opt=paths=source_relative --go-grpc_out=./pb --go-grpc_opt=paths=source_relative
  generate-users:
    aliases:
      - gen-users
    cmds:
      - mkdir -p pb
      - protoc -I proto proto/users.proto --go_out=./pb --go_opt=paths=source_relative --go-grpc_out=./pb --go-grpc_opt=paths=source_relative
  regenerate-all-pb:
    aliases:
      - gen
    cmds:
      - rm -rf pb
      - mkdir -p pb
      - protoc -I proto proto/users.proto --go_out=./pb --go_opt=paths=source_relative --go-grpc_out=./pb --go-grpc_opt=paths=source_relative
      - protoc -I proto proto/auth.proto --go_out=./pb --go_opt=paths=source_relative --go-grpc_out=./pb --go-grpc_opt=paths=source_relative
