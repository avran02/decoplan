openapi: 3.0.0
info:
  title: Chat Microservice API
  version: 1.0.0
  description: API для управления чатом и сообщениями через WebSocket.

servers:
  - url: ws://host/v1
    description: Основной WebSocket сервер микросервиса чата

components:
  schemas:
    Attachments:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            example: "1"
            description: ID вложения
          url:
            type: string
            format: url
            example: "https://files.host/uuid.jpg"
            description: URL вложения

    FromServerMessage:
      type: object
      properties:
        id:
          type: integer
          example: 1
        chatId:
          type: string
          example: "chat-uuid"
        sender:
          type: string
          example: "user123"
        content:
          type: object
          properties:
            text:
              type: string
              example: "Hello, world!"
              description: Текст вложения
            attachments:
              $ref: "#/components/schemas/Attachments"
              description: Список вложений
        CreatedAt:
          type: string
          format: date-time
          example: "2023-10-02T10:00:00Z"

    AskMessagesDto:
      type: object
      properties:
        chatId:
          type: string
          example: "chat-uuid"
        limit:
          type: integer
          example: 10
          description: Количество сообщений
        offset:
          type: integer
          example: 0
          description: Смещение

    DeleteMessageDto:
      type: object
      properties:
        chatId:
          type: string
          example: "chat-uuid"
        messageId:
          type: integer
          example: 1
          description: ID сообщения

    NewMessageDto:
      type: object
      description: Новое сообщение от пользователя на сервер
      properties:
        chatId:
          type: string
          example: "chat-uuid"
        content:
          type: object
          properties:
            text:
              type: string
              example: "Hello, world!"
              description: Текст вложения
            attachments:
              $ref: "#/components/schemas/Attachments"
              description: Список вложений

paths:
  /connect:
    post:
      tags:
        - Connection
      security:
        - bearerAuth: []
      summary: Установить соединение WebSocket
      responses:
        "101":
          description: Соединение установлено
  /disconnect:
    post:
      tags:
        - Connection
      security:
        - bearerAuth: []
      summary: Закрыть соединение WebSocket
      responses:
        "101":
          description: Соединение закрыто

  /new-message:
    get:
      tags:
        - FromServerEvent
      summary: Сервер отправляет новое сообщение на клиент
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FromServerMessage"
  /delete-message:
    get:
      tags:
        - FromServerEvent
      summary: Сервер уведомляет об удалении сообщения
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMessageDto"

  /messages:
    put:
      tags:
        - FromUserEvent
      summary: Получить список сообщений
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskMessagesDto"
      responses:
        "200":
          description: Список сообщений получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FromServerMessage"

    post:
      tags:
        - FromUserEvent
      summary: Отправить новое сообщение
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMessageDto"
      responses:
        "200":
          description: Сообщение успешно отправлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FromServerMessage"

  /messages/{id}:
    delete:
      tags:
        - FromUserEvent
      summary: Удалить сообщение по ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMessageDto"
      responses:
        "200":
          description: Сообщение успешно удалено
